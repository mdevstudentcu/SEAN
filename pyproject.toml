[project]
name = "pnt"
version = "0.1.0"
description = "Resilient navigation and timing from signals of opportunity (Hack the Horizons, Challenge 2)"
readme = "README.md"
requires-python = ">=3.11"  # Raspberry Pi OS Bookworm ships 3.11
dependencies = [
    "numpy>=1.26",
    "msgspec>=0.18",
    "mcap>=1.1",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Laptop: estimator, front-ends, dashboard, analysis
ground = [
    "scipy>=1.11",
    "pyzmq>=25",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pymavlink>=2.4.41",
    "pyModeS>=3.6",  # pnt.frontends.adsb uses the 3.x PipeDecoder API (tested on 3.6.1)
    "matplotlib>=3.8",
    "sgp4>=2.23",
    "numba>=0.60",  # the EKF's covariance kernels, pnt.nav._kernels (ADR-0054)
]
# Raspberry Pi: capture and streaming only (keep it light)
payload = [
    "pyzmq>=25",
    "pyserial>=3.5",
    "pymavlink>=2.4.41",
]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
]

[project.scripts]
pnt = "pnt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pnt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Run tests across all cores (pytest-xdist); `-n0` runs them serially.
addopts = "-n auto"

[tool.ruff]
line-length = 99
target-version = "py311"
extend-exclude = ["src/pnt/io/pnt_mavlink.py", "firmware"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
