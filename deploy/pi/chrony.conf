# GPS time from NMEA (coarse, labels the second) + PPS (precise edge). ASM-04.
# NMEA comes from the GPS HAT on /dev/serial0 through gpsd (SHM 0); PPS from GPIO4 (ADR-0014).
refclock SHM 0 refid NMEA offset 0.0 delay 0.2 noselect
refclock PPS /dev/pps0 lock NMEA refid PPS precision 1e-7
makestep 1 3
