; ESP32 RC bridge (ADR-0029): gamepad over Wi-Fi -> CRSF to INAV. Tethered indoor hover only.
; Build: `pio run -d firmware/esp32-rc-bridge`. Needs include/secrets.h (see README.md).
[env:esp32dev]
; Pinned: main.cpp's softAP() call uses the Arduino core 3.3.12 signature.
platform = espressif32 @ 8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
