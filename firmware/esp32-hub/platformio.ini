; ESP32-S3 sensor hub (ADR-0005). Build: `just fw`, flash: `just fw-flash`.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
build_flags =
    -I lib/pnt_mavlink
    -DARDUINO_USB_CDC_ON_BOOT=1
; Sensor libraries are added when the parts arrive (BMI160, BME280):
lib_deps =
