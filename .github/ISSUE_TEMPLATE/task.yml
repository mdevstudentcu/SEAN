name: Task
description: A piece of work to pick up
body:
  - type: textarea
    id: what
    attributes:
      label: What and why
      description: What needs doing and what it unblocks
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Checkable outcomes, so whoever picks it up knows when to stop
      value: "- [ ] "
    validations:
      required: true
  - type: input
    id: traces
    attributes:
      label: Traces to
      description: REQ / UC / ADR / ICD / RSK IDs, or "none"
      placeholder: REQ-01, ADR-0015
