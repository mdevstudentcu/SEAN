name: Bug
description: Something that runs but gives the wrong result, or doesn't run
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened vs what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Command, scenario/session, seed, commit
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      render: shell
