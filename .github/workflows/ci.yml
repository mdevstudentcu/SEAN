name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # ground: the laptop-side stack (matplotlib for plots, etc.), so its tests run in CI too
      - run: uv sync --extra ground --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: Smoke-test the sim end to end
        run: uv run pnt sim gps-outage --out /tmp/smoke.mcap
      - name: Smoke-test plotting
        run: uv run pnt plot /tmp/smoke.mcap --out /tmp/smoke-plots

  generated-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra ground
      - name: Generated MAVLink code matches systems/icd/pnt.xml
        run: |
          uv run mavgen.py --lang=C --wire-protocol=2.0 --output=firmware/esp32-hub/lib/pnt_mavlink systems/icd/pnt.xml
          uv run mavgen.py --lang=Python3 --wire-protocol=2.0 --output=src/pnt/io/pnt_mavlink.py systems/icd/pnt.xml
          # mavgen stamps the build date into version.h, so ignore that line or the job fails on
          # every day after the code was generated
          git diff --exit-code -I '^#define MAVLINK_BUILD_DATE' -- firmware/esp32-hub/lib/pnt_mavlink src/pnt/io/pnt_mavlink.py

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install platformio
      - run: pio run -d firmware/esp32-hub
