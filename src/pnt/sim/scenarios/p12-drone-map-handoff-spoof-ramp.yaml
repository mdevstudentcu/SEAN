# P12's hand-off (p12-drone-map-handoff) with the drone's GNSS spoofed while it builds the map
# (#96): a carry-off ramp, the rate and direction of `spoof-ramp` (2 m/s to the north-east),
# from 100 s into the drone's 300 s circuit, so 200 s of it (400 m) before the hand-off. The
# drone's filter takes the spoofed track as trusted, and the tower clocks it learns fit it. The
# ground user's world, records and GPS loss are the base scenario's, record for record.
# Software fault injection only (sim/attacks.py). Results: analysis/p12_spoofed_map.py.
extends: p12-drone-map-handoff
description: As p12-drone-map-handoff, with the drone's GNSS dragged at 2 m/s while it builds the map.
faults:
  - {type: spoof_ramp, source: gnss, start_s: 1900, rate_mps: 2.0, direction_deg: 45}   # TBC
handoff:
  map_ages_s: [0]   # the map handed on the moment the circuit ends (circuit 1800-2100 s)
