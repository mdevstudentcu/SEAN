# A crude spoofer takes over at once: GPS jumps 300 m east. Verifies REQ-04 (UC-01, UC-02).
description: GPS position jumps 300 m east at t=150 s and stays there.
duration_s: 360
dt_s: 0.1
origin_llh: [45.3876, -75.6960, 70.0]   # Carleton campus (session ENU origin)
trajectory: {type: square, side_m: 200, speed_mps: 8, altitude_m: 30}
sources:
  gnss: {rate_hz: 5, sigma_m: 2.5}
  baro: {rate_hz: 10, sigma_m: 0.5}
  lte:
    model: pseudorange
    rate_hz: 1
    n_emitters: 6
    ring_radius_m: [800, 3000]   # SYNTHETIC geometry until data/reference/ has real sites
    sigma_m: 20.0                # TBC (RSK-02)
    clock_rw_m: 0.2
    init_bias_m: 1000.0
faults:
  - {type: spoof_jump, source: gnss, start_s: 150, offset_enu_m: [300, 0, 0]}
