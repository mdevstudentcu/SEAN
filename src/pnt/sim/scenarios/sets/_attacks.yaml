# The faults every environment in this folder is tested against (issue #16). A scenario name is
# <environment>-<entry>, for example `realistic-outage`. `pnt eval realistic` runs them all.
nominal: []
outage:
  - {type: outage, source: gnss, start_s: 120, end_s: 240}
gps-no-fix:   # receiver keeps talking but has no position (PX4 test: gpsFixLoss)
  - {type: gps_no_fix, source: gnss, start_s: 120, end_s: 240}
gps-low-sats:   # few satellites but position still good: must not raise an alarm
  - {type: gps_low_sats, source: gnss, start_s: 120, end_s: 240, satellites: 3}
gps-return:   # GPS jumps, then good GPS returns (PX4 test: gnssJumpDetectionDRMode)
  - {type: spoof_jump, source: gnss, start_s: 150, end_s: 200, offset_enu_m: [300, 0, 0]}
spoof-ramp:
  - {type: spoof_ramp, source: gnss, start_s: 150, rate_mps: 2.0, direction_deg: 45}
spoof-jump:
  - {type: spoof_jump, source: gnss, start_s: 150, offset_enu_m: [300, 0, 0]}
time-spoof:
  - {type: time_spoof, source: gnss, start_s: 150, rate_ns_per_s: 50}
meaconing:
  - {type: meaconing, source: gnss, start_s: 150, delay_s: 5.0}
jamming-zone:
  - {type: jamming_zone, source: gnss, center_llh: [45.3876, -75.694085, 70.0], radius_m: 60, onset_m: 250}
baro-drift:   # sensor degradation
  - {type: baro_drift, source: baro, start_s: 120, rate_mps: 0.2}
tower-loss:   # all towers lost while GPS keeps working
  - {type: outage, source: lte, start_s: 120, end_s: 240}
tower-clock-step:   # one tower's clock jumps
  - {type: tower_clock_step, source: lte, emitter: "lte:sim1", start_s: 150, offset_m: 300.0}
long-outage:   # GPS lost for the last 300 s of the run (T1 asks for >= 300 s, systems/plan.md)
  - {type: outage, source: gnss, start_s: 60}
capture-pi4b:   # the Pi 4B payload board's capture effects (ADR-0018, issue #53), not an attack
  # gaps_per_min, gap_s: measured, session 20261111-0040-static-fullsuite (recorded at 4d3598b,
  # `pnt day1` on the Pi): both radios (1.92 + 2.4 MS/s, SD card) dropped samples 4 times in
  # 599.4 s, at the same instants on both (starts within 0.5 s), so one shared gap per event:
  # 0.40 per min. Lengths 1.2 to 8.4 s, mean 4.3 s (dropped_samples_est / gaps / rate_hz, both
  # radios). The model draws fixed-length gaps; the real ones vary 7x (deploy/pi/REHEARSAL.md).
  # This is IQ to the SD card. To a USB drive (20261111-0151-static-fullsuite2, recorded at
  # c007627): 0 gaps in 599.4 s on both radios, so below about 0.3 per min (95 %), not zero.
  # Which storage flies is ADR-0042 (Proposed); this profile stays the SD card's until then.
  # timestamp_jitter_ms: TBC. The same session's host arrival latency above the envelope is
  # std 81 / 59 ms, p99 312 / 121 ms (SDR A / B), but records are timed from sample counts
  # against that envelope, so it is not the record timestamp error this term models (TBD).
  # stream_loss: TBC, not measured (no laptop recording of the stream in that session).
  - {type: capture_faults, board: pi4b, gaps_per_min: 0.40, gap_s: 4.3, timestamp_jitter_ms: 1.0, stream_loss: 0.0}
