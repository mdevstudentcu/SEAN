# Realistic: our best current estimate of a low-cost receiver in the real world. Every value is
# TBC until the radio test and published data replace it (ADR-0015).
# Caveat: `receiver_clock: true` puts one shared clock error into every tower reading. `ekf`,
# `ekf-imu`, `ekf-mhss` and `baseline` leave it out (`pseudorange_receiver_clock` is off by
# default; `ekf-calibrated` has it on). Once GPS is lost they accept most tower readings (73 % on
# `realistic-long-outage`), and the position moves with our clock's drift (20 ppb, 6 m/s) while
# the covariance shrinks: T1 p95 2.4 km, HPL bound 2.7 % on the worst run. Results here measure
# that gap, not how hard the environment is (#228, ADR-0045 Proposed, rx_clock_in_towers.py).
description: Best current estimate of real conditions for a low-cost receiver.
duration_s: 360
dt_s: 0.1
origin_llh: [45.3876, -75.6960, 70.0]   # Carleton campus (session ENU origin)
trajectory: {type: loop, radius_m: 150, speed_mps: 8, altitude_m: 30}
clock: {drift_ppb: 20, rw_ns: 2.0}
sources:
  gnss: {rate_hz: 5, sigma_m: 2.5, time_sigma_ns: 20, health: true}
  baro: {rate_hz: 10, sigma_m: 0.5}
  imu: {rate_hz: 100}   # MPU6050 (ADR-0014, sim/sensors.py); rate TBC until the Pi 4B day-1 test (ADR-0018)
  lte:
    model: pseudorange
    rate_hz: 1
    towers_from: {file: cells-ottawa.csv, carrier: TELUS, tx_mhz: 886.25, min_km: 0.8, count: 4}   # one radio hears one carrier
    sigma_m: 50.0
    receiver_clock: true
    multipath: {sigma_m: 50.0, tau_s: 30.0}
    dropout: {availability: 0.75, block_s: 30.0}
    told_position_sigma_m: 100.0
# Tower clocks (ADR-0022, Proposed): each tower's clock is its network builder's clock plus its
# site's residual (plus a sector residual, unused: one emitter per site here). Each part is a
# two-state oscillator (offset, drift; models.oscillator). Every value is TBC.
# - Builder: no shared offset (FDD sites are only frequency-locked, 3GPP TS 36.104 6.5.1), a
#   shared drift, and OCXO frequency wander (Shamaei, Khalife & Kassas, IEEE TWC 2018).
# - Site: the per-tower offset and random walk this set used before (init_bias_m, clock_rw_m)
#   and OCXO frequency wander.
# - Drift: the 0.05 m/s per tower this set used before, its variance split evenly between
#   builder and site (0.0354 m/s each). The split is TBC: no source gives a builder's share.
# - Wander: drift_rw_mps = c sqrt(2 pi^2 h_-2) with h_-2 = 4e-26 (Shamaei et al. 2018).
# Every tower here is TELUS-built (one carrier), so all of them share the one builder clock.
tower_clocks:
  builder: {drift_mps: 0.0354, drift_rw_mps: 2.7e-4}
  site: {offset_m: 1000.0, drift_mps: 0.0354, offset_rw_m: 0.2, drift_rw_mps: 2.7e-4}
provenance:
  clock: TBC
  gnss: TBC
  baro: TBC
  imu: TBC   # MPU6050: noise datasheet, the rest literature (sim/sensors.py)
  lte_noise: TBC
  lte_geometry: literature   # ISED site registry (data/reference/README.md)
  tower_clocks: TBC   # form: Shamaei et al. 2018; grouping: ADR-0022; sizes unsourced
  multipath: TBC   # compared with MedComNet blocked 10 MHz link-bias std, a ray-traced Milan dataset (analysis/error_bounds.py), not a source
  dropout: TBC
  tower_position_error: TBC
