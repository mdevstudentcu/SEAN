# Realistic: our best current estimate of a low-cost receiver in the real world. Every value is
# TBC until the radio test and published data replace it (ADR-0015).
# Caveat: `receiver_clock: true` puts one shared clock error into every tower reading. Neither
# estimator on main models that yet (#12), so they reject the towers here: results in this
# environment measure that gap, not how hard the environment is.
description: Best current estimate of real conditions for a low-cost receiver.
duration_s: 360
dt_s: 0.1
origin_llh: [45.3876, -75.6960, 70.0]   # Carleton campus (session ENU origin)
trajectory: {type: loop, radius_m: 150, speed_mps: 8, altitude_m: 30}
clock: {drift_ppb: 20, rw_ns: 2.0}
sources:
  gnss: {rate_hz: 5, sigma_m: 2.5, time_sigma_ns: 20, health: true}
  baro: {rate_hz: 10, sigma_m: 0.5}
  lte:
    model: pseudorange
    rate_hz: 1
    towers_from: {file: cells-ottawa.csv, carrier: TELUS, tx_mhz: 886.25, min_km: 0.8, count: 4}   # one radio hears one carrier
    sigma_m: 50.0
    clock_rw_m: 0.2
    init_bias_m: 1000.0
    receiver_clock: true
    drift_sigma_mps: 0.05
    multipath: {sigma_m: 50.0, tau_s: 30.0}
    dropout: {availability: 0.75, block_s: 30.0}
    told_position_sigma_m: 100.0
provenance:
  clock: TBC
  gnss: TBC
  baro: TBC
  lte_noise: TBC
  lte_geometry: literature   # ISED site registry (data/reference/README.md)
  tower_drift: TBC
  multipath: literature   # bounded by MedComNet blocked 10 MHz link-bias std (analysis/error_bounds.py)
  dropout: TBC
  tower_position_error: TBC
