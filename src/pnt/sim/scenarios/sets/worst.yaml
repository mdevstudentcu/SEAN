# Worst: few towers, strong reflections, poor tower data, and a filter told the noise is better
# than it is. A stress case, not a prediction. Every value is TBC (ADR-0015).
# Caveat: `receiver_clock: true` puts one shared clock error into every tower reading. `ekf`,
# `ekf-imu`, `ekf-mhss` and `baseline` leave it out (`pseudorange_receiver_clock` is off by
# default; `ekf-calibrated` has it on). Once GPS is lost the tower readings they accept (12 % on
# `worst-long-outage`) move the position with our clock's drift (100 ppb, 30 m/s): T1 p95 10 km.
# Results here measure that gap, not how hard the environment is (#228, ADR-0046 Proposed,
# analysis/rx_clock_in_towers.py).
description: Stress case with few towers and strong persistent errors.
duration_s: 360
dt_s: 0.1
origin_llh: [45.3876, -75.6960, 70.0]   # Carleton campus (session ENU origin)
trajectory: {type: loop, radius_m: 150, speed_mps: 8, altitude_m: 30}
clock: {drift_ppb: 100, rw_ns: 5.0}
sources:
  gnss: {rate_hz: 5, sigma_m: 2.5, time_sigma_ns: 20, health: true}
  baro: {rate_hz: 10, sigma_m: 0.5}
  lte:
    model: pseudorange
    rate_hz: 1
    towers_from: {file: cells-ottawa.csv, carrier: TELUS, tx_mhz: 886.25, min_km: 0.8, count: 3}   # one radio hears one carrier
    sigma_m: 100.0
    told_sigma_m: 30.0
    receiver_clock: true
    multipath: {sigma_m: 100.0, tau_s: 120.0}
    dropout: {availability: 0.5, block_s: 30.0}
    told_position_sigma_m: 300.0
# Tower clocks (ADR-0022, Proposed): each tower's clock is its network builder's clock plus its
# site's residual (plus a sector residual, unused: one emitter per site here). Each part is a
# two-state oscillator (offset, drift; models.oscillator). Every value is TBC.
# - Builder: no shared offset (FDD sites are only frequency-locked, 3GPP TS 36.104 6.5.1), a
#   shared drift, and OCXO frequency wander (Shamaei, Khalife & Kassas, IEEE TWC 2018).
# - Site: the per-tower offset and random walk this set used before (init_bias_m, clock_rw_m)
#   and OCXO frequency wander.
# - Drift: the 0.2 m/s per tower this set used before, its variance split evenly between
#   builder and site (0.1414 m/s each). The split is TBC: no source gives a builder's share.
# - Wander: drift_rw_mps = c sqrt(2 pi^2 h_-2) with h_-2 = 4e-26 (Shamaei et al. 2018).
# Every tower here is TELUS-built (one carrier), so all of them share the one builder clock.
tower_clocks:
  builder: {drift_mps: 0.1414, drift_rw_mps: 2.7e-4}
  site: {offset_m: 1000.0, drift_mps: 0.1414, offset_rw_m: 0.2, drift_rw_mps: 2.7e-4}
provenance:
  clock: TBC
  gnss: TBC
  baro: TBC
  lte_noise: TBC
  lte_geometry: literature   # ISED site registry (data/reference/README.md)
  tower_clocks: TBC   # form: Shamaei et al. 2018; grouping: ADR-0022; sizes unsourced
  multipath: TBC   # compared with MedComNet blocked 10 MHz link-bias p95, a ray-traced Milan dataset (analysis/error_bounds.py), not a source
  dropout: TBC
  tower_position_error: TBC
