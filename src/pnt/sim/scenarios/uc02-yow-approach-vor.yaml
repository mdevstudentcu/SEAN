# UC-02 with bearings from the real VORs (#11, #13, #94): ICD `bearing`. The stations are the
# four VORs in data/reference/navaids.csv, as `pnt.frontends.vor.load_stations` reads them
# (elevation above sea level, no geoid; tests/test_vor.py keeps the two equal). On this approach
# only YOW is inside `max_range_m` (22 to 32 km); MSS (78 to 87 km), YMX (118 km) and YUL
# (133 km) are beyond it and give no records. YOW's radials run along the approach course (127
# to 131 deg), so they fix cross-track position only. Every error value is literature, TBC until
# our own VOR captures (verification.md, Sim validity: VOR bearing).
extends: uc02-yow-approach
description: The UC-02 approach, GPS lost for the last 80 s, with bearings from the real VORs.
sources:
  vor:
    model: bearing
    rate_hz: 1
    emitters_llh:   # navaids.csv: lat, lon (deg), elevation_ft * 0.3048 (m)
      - [45.441699981689, -75.897003173828, 137.16]          # YOW Ottawa VOR-DME, 114.6 MHz
      - [44.914398193359375, -74.72270202636719, 60.96]      # MSS Massena VORTAC, 114.1 MHz
      - [45.888301849365234, -74.37570190429688, 506.8824]   # YMX Mirabel VOR-DME, 116.7 MHz
      - [45.6150016784668, -73.9717025756836, 60.96]         # YUL Montreal VOR-DME, 116.3 MHz
    sigma_deg: 1.0                 # TBC: literature, receiver noise of a software VOR decoder
    bias_deg: 1.0                  # TBC: literature, per-station site error, 1-sigma
    max_range_m: 75000             # TBC: low-altitude service volume (40 NM)
    cone_deg: 60                   # TBC: no bearing inside the cone of confusion
